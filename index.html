<head>

<style>
/* 夜の霧の中で、金の縁の条文カードを振るう。魔物は大きく、文字は少なく */
:root{
  --bg:#14122b; --bg2:#221d45; --ink:#f3eee2; --ink2:#b9b2d0; --line:#ffffff22;
  --gold:#e6b84c; --gold2:#9c7424; --red:#e2574c; --red2:#a8352d; --ok:#5fd0a0;
  --paper:#f5ecd6; --pink:#2a2238;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-head:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 70% at 50% 0%,#2c2560 0%,var(--bg) 60%) fixed,var(--bg);color:var(--ink);font-family:var(--f-body);font-weight:500;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(1.5px 1.5px at 12% 18%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 72% 9%,#fff7 50%,transparent 51%),radial-gradient(1.5px 1.5px at 88% 34%,#fff6 50%,transparent 51%),radial-gradient(1px 1px at 33% 42%,#fff5 50%,transparent 51%),radial-gradient(1px 1px at 55% 24%,#fff6 50%,transparent 51%);z-index:0}
.wrap{position:relative;z-index:1;max-width:460px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px;display:flex;flex-direction:column;gap:14px;min-height:100%;box-sizing:border-box}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px}
h1{font-family:var(--f-head);font-weight:800;font-size:20px;margin:0;letter-spacing:.06em;text-align:center;flex:1}
h1 small{display:block;font-family:var(--f-body);font-size:11px;letter-spacing:0;color:var(--ink2);font-weight:500}
.icon{all:unset;cursor:pointer;font-size:18px;min-width:44px;height:44px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);box-sizing:border-box;padding:0 8px;background:#ffffff0d}
button.main,a.main{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border-radius:16px;background:linear-gradient(180deg,#f0c860,#d39a2c);color:#2a1c05;font-weight:700;font-size:17px;padding:0 16px;text-align:center;box-shadow:0 4px 0 var(--gold2),0 0 24px #e6b84c33}
button.main:active{transform:translateY(2px);box-shadow:0 2px 0 var(--gold2)}
button.main small{font-weight:500;opacity:.75}
button.main.alt{background:linear-gradient(180deg,#9b4ad6,#6b2fa3);color:#fff;box-shadow:0 4px 0 #44176e,0 0 24px #9b4ad633}
button.sub,a.sub{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;border-radius:14px;border:1px solid var(--line);background:#ffffff10;color:var(--ink);font-weight:700;font-size:15px;padding:0 12px;text-align:center}
button.sub:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px}.row>.sub,.row>.main{flex:1 1 0}
.note{color:var(--ink2);font-size:13px;line-height:1.6;margin:0;text-align:center}
.note a{color:var(--gold);display:inline-flex;align-items:center;min-height:44px}
/* 魔物 */
.arena{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:4px}
.mon{width:min(58vw,210px);aspect-ratio:1;position:relative}
.mon svg{width:100%;height:100%;overflow:visible;display:block}
.mon .bob{animation:bob 3.2s ease-in-out infinite;transform-origin:50% 80%}
@keyframes bob{50%{transform:translateY(-7px) scale(1.02,.98)}}
.mon .bob.weak{animation:wobble 2.4s ease-in-out infinite}
@keyframes wobble{25%{transform:translateY(-3px) rotate(-2deg)}75%{transform:translateY(-1px) rotate(2deg)}}
.mon .smoke{animation:smoke 2.2s ease-out infinite}
@keyframes smoke{0%{transform:translateY(8px) scale(.5);opacity:0}30%{opacity:.5}100%{transform:translateY(-26px) scale(1.4);opacity:0}}
.mon.flee svg{animation:flee .9s ease-in forwards}
@keyframes flee{30%{transform:translateX(-12px)}100%{transform:translateX(160px) scale(.7);opacity:0}}
.mon.hit svg{animation:hit .45s ease-out}
@keyframes hit{0%{filter:brightness(3.2)}20%{transform:translateX(-10px) rotate(-3deg)}45%{transform:translateX(9px) rotate(2deg)}70%{transform:translateX(-4px)}100%{filter:none;transform:none}}
.mon.lunge svg{animation:lunge .5s ease-in-out}
@keyframes lunge{40%{transform:scale(1.22) translateY(18px)}100%{transform:none}}
.mon.vanish svg{animation:vanish .9s ease-in forwards}
@keyframes vanish{0%{filter:brightness(2.5)}100%{transform:scale(1.35) translateY(-20px);filter:blur(10px) brightness(3);opacity:0}}
.slash{position:absolute;left:50%;top:45%;width:150%;height:6px;border-radius:6px;background:linear-gradient(90deg,transparent,#fff,#ffe9a6,transparent);transform:translate(-50%,-50%) rotate(-32deg) scaleX(0);box-shadow:0 0 18px #ffe39a;pointer-events:none;animation:slash .38s ease-out forwards}
@keyframes slash{0%{transform:translate(-50%,-50%) rotate(-32deg) scaleX(0);opacity:1}60%{transform:translate(-50%,-50%) rotate(-32deg) scaleX(1);opacity:1}100%{transform:translate(-50%,-50%) rotate(-32deg) scaleX(1);opacity:0}}
.pop{position:absolute;left:50%;top:18%;transform:translateX(-50%);font-family:var(--f-head);font-size:34px;color:#ffe9a6;text-shadow:0 0 12px #e6b84c,0 2px 0 #7a5410;pointer-events:none;animation:popup .9s ease-out forwards}
.pop small{display:block;font-family:var(--f-body);font-size:14px;letter-spacing:.1em;text-align:center}
.pop{white-space:nowrap;font-size:28px}
.slash.s2{animation-delay:.12s;transform:translate(-50%,-50%) rotate(32deg) scaleX(0);animation-name:slash2}
@keyframes slash2{0%{transform:translate(-50%,-50%) rotate(32deg) scaleX(0);opacity:1}60%{transform:translate(-50%,-50%) rotate(32deg) scaleX(1);opacity:1}100%{transform:translate(-50%,-50%) rotate(32deg) scaleX(1);opacity:0}}
.chain{position:absolute;left:50%;top:52%;width:130%;height:12px;border-radius:6px;background:repeating-linear-gradient(90deg,#9ff5e6 0 14px,transparent 14px 18px,#5fd0c0 18px 32px,transparent 32px 36px);box-shadow:0 0 14px #5fd0c0;pointer-events:none;animation:chain .7s ease-out forwards;--r:-22deg}
.chain.c2{--r:22deg;top:58%}
@keyframes chain{0%{transform:translate(-50%,-50%) rotate(var(--r)) scaleX(1.8);opacity:0}40%{transform:translate(-50%,-50%) rotate(var(--r)) scaleX(1);opacity:1}75%{transform:translate(-50%,-50%) rotate(var(--r)) scaleX(.82);opacity:1}100%{transform:translate(-50%,-50%) rotate(var(--r)) scaleX(.82);opacity:0}}
.pillar{position:absolute;left:50%;top:-60%;width:46%;height:170%;transform:translateX(-50%) scaleX(0);background:linear-gradient(180deg,#ffffff00,#fffbe6 30%,#cfe6ff 70%,#ffffff00);filter:blur(2px);box-shadow:0 0 40px #cfe6ff;pointer-events:none;animation:pillar .75s ease-out forwards;border-radius:40%}
@keyframes pillar{0%{transform:translateX(-50%) scaleX(0);opacity:0}30%{transform:translateX(-50%) scaleX(1);opacity:1}100%{transform:translateX(-50%) scaleX(.2);opacity:0}}
.ring{position:absolute;left:50%;top:52%;width:40%;aspect-ratio:1;border-radius:50%;border:6px solid #ffb35c;box-shadow:0 0 18px #ff9a3c,inset 0 0 12px #ff9a3c;transform:translate(-50%,-50%) scale(.2);pointer-events:none;animation:ring .7s ease-out forwards}
.ring.r2{animation-delay:.12s}.ring.r3{animation-delay:.24s}
@keyframes ring{0%{transform:translate(-50%,-50%) scale(.2);opacity:1}100%{transform:translate(-50%,-50%) scale(2.6);opacity:0}}
.charm{position:absolute;left:50%;top:52%;width:54px;height:84px;margin:-42px 0 0 -27px;background:linear-gradient(180deg,#fff6dc,#f3dfae);border:2px solid #c0392b;border-radius:4px;color:#c0392b;font-family:var(--f-head);font-size:30px;display:grid;place-items:center;box-shadow:0 0 18px #ff8fb8;pointer-events:none;animation:charm .8s cubic-bezier(.2,.9,.3,1.2) forwards}
@keyframes charm{0%{transform:translateY(240px) rotate(-200deg) scale(.6);opacity:0}45%{transform:translateY(0) rotate(-8deg) scale(1.15);opacity:1}75%{transform:rotate(0) scale(1);opacity:1}100%{transform:scale(1.4);opacity:0}}
.mon.fx-min.hit svg{animation:bind .6s ease-out}
@keyframes bind{0%{filter:brightness(2) hue-rotate(40deg)}30%{transform:scale(.9,1.04)}60%{transform:scale(.94,1.02)}100%{filter:none;transform:none}}
.mon.fx-ken.hit svg{animation:smite .6s ease-out}
@keyframes smite{0%{filter:brightness(3.5)}30%{transform:translateY(10px) scale(1.04,.92)}100%{filter:none;transform:none}}
.mon.fx-rou.hit svg{animation:quake .55s linear}
.ink{position:absolute;left:50%;top:48%;width:140%;height:22px;border-radius:50% 40% 60% 30%;background:linear-gradient(90deg,transparent,#1a0f2e 20%,#3b2a6b 60%,transparent);transform:translate(-50%,-50%) rotate(18deg) scaleX(0);box-shadow:0 0 10px #b9a6ff;pointer-events:none;animation:ink .5s ease-out forwards}
.ink.i2{top:60%;height:12px;animation-delay:.14s;--r:-12deg;transform:translate(-50%,-50%) rotate(-12deg) scaleX(0);animation-name:ink2}
@keyframes ink{60%{transform:translate(-50%,-50%) rotate(18deg) scaleX(1);opacity:1}100%{transform:translate(-50%,-50%) rotate(18deg) scaleX(1);opacity:0}}
@keyframes ink2{60%{transform:translate(-50%,-50%) rotate(-12deg) scaleX(1);opacity:1}100%{transform:translate(-50%,-50%) rotate(-12deg) scaleX(1);opacity:0}}
.sig{position:absolute;left:50%;top:6%;transform:translateX(-50%);display:flex;gap:8px;padding:6px 8px;border-radius:12px;background:#1a1a22;border:2px solid #444;pointer-events:none;animation:sigbox .9s ease-out forwards}
.sig i{width:22px;height:22px;border-radius:50%;background:#333;animation:sig .9s steps(1) forwards}
.sig i:nth-child(1){--c:#4cd07a;animation-delay:0s}.sig i:nth-child(2){--c:#ffc83d;animation-delay:.22s}.sig i:nth-child(3){--c:#ff4b3e;animation-delay:.44s}
@keyframes sig{0%{background:var(--c);box-shadow:0 0 16px var(--c)}30%{background:#333;box-shadow:none}}
@keyframes sigbox{85%{opacity:1}100%{opacity:0}}
.mon.fx-sig.hit svg{animation:quake .5s linear .44s}
@keyframes quake{0%{filter:brightness(2.4)}10%,50%,90%{transform:translateX(-7px)}30%,70%{transform:translateX(7px)}100%{filter:none;transform:none}}
.ask small{display:block;font-size:11px;color:var(--ink2);font-weight:500;margin-top:1px}
.ask{font-size:16px;font-weight:700;color:var(--ink)}
.law p.pick{font-size:12.5px;color:#7a3a2a;border-top:1px dashed #c99a3d;padding-top:6px}
.newlaw{margin:0;font-size:13px;color:#ffe9a6;background:#e6b84c1c;border:1px solid #e6b84c55;border-radius:12px;padding:8px 12px}
.mon.enter svg{animation:enter .7s ease-out}
@keyframes enter{0%{opacity:0;filter:blur(12px) brightness(.3);transform:scale(.7) translateY(20px)}100%{opacity:1;filter:none;transform:none}}
.pop.bad{color:#ffb3ab;text-shadow:0 0 12px #e2574c,0 2px 0 #6a1d17}
@keyframes popup{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}25%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-30px) scale(1)}}
.spark{position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;background:#ffe9a6;box-shadow:0 0 10px #ffd36b;pointer-events:none;animation:spark .9s ease-out forwards}
@keyframes spark{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
.hurt{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 90px 30px #e2574c88;animation:hurt .5s ease-out forwards;z-index:5}
@keyframes hurt{to{opacity:0}}
.mname{font-family:var(--f-head);font-size:22px;letter-spacing:.08em;text-align:center;line-height:1.1}
.mname small{display:block;font-family:var(--f-body);font-size:11px;color:var(--ink2);letter-spacing:.02em;margin-top:3px}
.hpbar{display:flex;gap:4px;width:min(60vw,220px)}
.hpbar i{flex:1;height:9px;border-radius:5px;background:linear-gradient(90deg,#ff7a6b,#e2574c);box-shadow:0 0 8px #e2574c88;transition:background .3s,box-shadow .3s}
.hpbar i.off{background:#ffffff1c;box-shadow:none}
.deed{background:linear-gradient(180deg,#2d2656,#231e47);border:1px solid #ffffff2a;border-radius:16px;padding:12px 14px;font-size:17px;line-height:1.6;text-align:center;font-weight:700;position:relative;box-shadow:0 8px 24px #0005}
.deed::before{content:"事件";position:absolute;top:-10px;left:14px;font-size:11px;background:var(--red2);color:#fff;border-radius:8px;padding:1px 8px;font-weight:700;letter-spacing:.1em}
.ask{font-size:13px;color:var(--ink2);text-align:center;margin:0}
.cards{display:flex;flex-direction:column;gap:9px}
.card{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:60px;border-radius:14px;background:linear-gradient(180deg,#fbf3df,#ecdcb6);color:var(--pink);padding:8px 14px;border:2px solid #c99a3d;box-shadow:0 3px 0 #8b6a2b,inset 0 0 0 1px #fff8;transition:transform .12s}
.card:active{transform:translateY(2px)}
.card .no{font-size:11px;line-height:1.3;color:#6e5a3a;min-width:66px;text-align:center;border-right:1px dashed #b89a5e;padding-right:10px}
.card .no b{display:block;font-size:15px;color:#3a2a14}
.card .nm{font-family:var(--f-head);font-size:20px;letter-spacing:.04em;flex:1}
.card.right{border-color:var(--ok);box-shadow:0 0 0 3px #5fd0a066,0 0 24px #5fd0a088}
.card.wrong{border-color:var(--red);opacity:.75;filter:saturate(.5)}
.card.gone{opacity:.25;filter:grayscale(1);cursor:default;text-decoration:line-through}
.card:disabled{cursor:default}
.cards.done .card:not(.right):not(.wrong){opacity:.4}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px}
.shield{display:flex;gap:4px;font-size:20px;align-items:center}
.shield span{transition:opacity .3s,filter .3s}.shield .off{opacity:.18;filter:grayscale(1)}
.shield small{font-size:12px;color:var(--ink2);margin-right:4px}
.foot .sub{min-height:44px;font-size:14px}
.law{background:linear-gradient(180deg,#fbf3df,#efe2c2);color:var(--pink);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 8px 24px #0006;animation:up .3s ease-out;border:2px solid #c99a3d}
.law .hd{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.law .hd b{font-size:12px;border-radius:8px;padding:2px 8px;color:#fff;background:#237a59}
.law.ng .hd b{background:var(--red2)}
.law q{display:block;font-family:var(--f-head);font-size:15px;line-height:1.7;quotes:"「" "」";color:#3a2a14}
.law p{margin:0;font-size:14px;line-height:1.6;color:#4d3e2a}
.law .main{margin-top:2px}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--gold)}.dots i.done{background:#fff9}
/* 討伐！ */
.win{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;animation:up .35s ease-out}
.win .big{font-family:var(--f-head);font-size:40px;letter-spacing:.2em;color:#ffe9a6;text-shadow:0 0 20px #e6b84c}
.win .big.lost{color:#c9c2df;text-shadow:none;font-size:30px}
.stars{color:var(--gold);letter-spacing:.12em;font-size:22px}
.stars .off{color:#ffffff80}
/* ホーム */
.title{font-family:var(--f-head);font-weight:800;font-size:44px;letter-spacing:.14em;text-align:center;margin:6px 0 0;background:linear-gradient(180deg,#fff6d6,#e6b84c 70%,#a8741e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 10px #e6b84c55);flex:none}
.lead{text-align:center;color:var(--ink2);margin:0;font-size:14px;line-height:1.7}
.trio{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;align-items:end}
.trio div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--ink2);min-width:0}
.trio svg{width:100%;max-width:120px;height:auto;overflow:visible}
.shade svg .body{filter:brightness(0)}.shade svg .eye{fill:#e2574c}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:#ffffff0d;border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.stats b{display:block;font-size:20px}
.stats small{color:var(--ink2);font-size:12px}
.rank{text-align:center;font-size:13px;color:var(--gold);display:flex;align-items:center;justify-content:center;gap:8px}
.rank svg{width:26px;height:26px}
.share{background:#ffffff0d;border-radius:14px;padding:12px;white-space:pre-line;font-size:15px;line-height:1.6;text-align:center;border:1px solid var(--line)}
.shares{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.shares a,.shares button{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:12px;border:1px solid var(--line);background:#ffffff10;color:var(--ink);font-size:14px;font-weight:700;text-decoration:none;padding:0 6px;box-sizing:border-box;font-family:inherit;cursor:pointer}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.minis div{display:flex;flex-direction:column;align-items:center;gap:2px;background:#ffffff0a;border:1px solid var(--line);border-radius:14px;padding:8px 4px;font-size:12px;min-width:0}
.minis svg{width:70px;height:70px;overflow:visible}
.minis .stars{font-size:14px}
.minis .gone svg{opacity:.35;filter:grayscale(1)}
/* 図鑑・条文帳 */
.dex{display:grid;grid-template-columns:1fr;gap:8px}
.dex>div{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;background:#ffffff0d;border:1px solid var(--line);border-radius:14px;padding:8px 12px;min-height:64px}
.dex svg{width:60px;height:60px;overflow:visible}
.dex b{font-family:var(--f-head);font-size:17px;letter-spacing:.06em}
.dex span{font-size:12px;color:var(--ink2);line-height:1.5}
.dex em{font-style:normal;font-size:12px;color:var(--gold);text-align:right;white-space:nowrap}
.dex .no svg .body{filter:brightness(0) opacity(.6)}.dex .no svg .eye{fill:#ffffff33}
.dex .sub{min-height:44px;font-size:13px;padding:0 10px}
.dex .btns{display:flex;flex-direction:column;gap:6px}
.sub.vv{border-color:#ff6f9a88;color:#ffc0d2}
.mname.vv{color:#ffb0c8}
.sec{font-family:var(--f-head);font-size:16px;margin:8px 0 0;color:var(--ink2);letter-spacing:.08em}
.wart{margin:0;font-size:12px;color:#ffb0c8;text-align:center}
.card .nm.tx{font-family:var(--f-body);font-size:14px;line-height:1.45;letter-spacing:0}
.deed.recall{font-size:15px;text-align:left}
.icon.snd.top{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:12px;z-index:2}
.book h3{font-family:var(--f-head);font-size:15px;margin:10px 0 6px;color:var(--gold);letter-spacing:.06em}

// 次へ：体力が尽きたら討伐、盾が尽きたら逃げられる。どちらでもなければ次の悪事
function next(runId, p) {
  save((s) => {
    const r = s.runs[RK];
    if (!r || r.id !== runId || r.view || r.cur.p !== p || !r.cur.ans) return;
    const c = r.cur, b = battle(r), end = c.hp <= 0 ? "win" : c.me <= 0 || c.p + 1 >= b.order.length ? "lost" : null;
    if (!end) { c.p++; c.ans = null; c.gone = null; return; }
    const st = end === "win" ? starsOf(c) : 0;
    r.res.push({ st, miss: c.miss, hint: c.hint, dmg: (hpOf(b) - (c.hp === null ? hpOf(b) : c.hp)) / hpOf(b) }); // dmg：逃げられたときの傷（逃げる絵に使う）
    if (end === "win") { const ids = b.m === -1 ? [D.BOSS.id] : b.m === -2 ? [] : [MON[b.m].id + (b.v ? "*" : "")]; for (const id of ids) { const d = s.dex[id] || { w: 0, b: 0 }; d.w++; d.b = Math.max(d.b, st); s.dex[id] = d; } if (r.mode === "p" && st === 3 && b.m >= 0) s.pstar = (s.pstar || 0) + 1; }
    let me = meOf(r.plan[r.res.length]);
    if (r.mode === "e") { const w = r.res.filter((x) => x.st).length; me = end === "win" ? Math.min(ME, c.me + (w % VWIN === 0 ? 1 : 0)) : 0; if (end === "lost") r.over = true; r.gain = me > c.me ? 1 : 0; s.ebest = Math.max(s.ebest || 0, w); } // 連戦：盾は持ち越し、3体ごとに1つ戻る。逃げられたら終わり
    r.view = end; r.nl = c.nl || []; r.cur = newCur(me);
    const bk = isDone(r) ? bookOf(s, r.mode) : null;
    if (bk && !bk[r.date]) bk[r.date] = { st: r.res.map((x) => x.st) }; // 終えた日を日ごとの記録に（結果を見る前に別の日へ移っても失わない）
  });
  play();
}

// ---- 結果 ----
function finish() {
  const s0 = load(), r = s0.runs[RK];
  if (!r) return home();
  if (r.mode === "e" && !isDone(r)) return play();
  let kofi = false, fresh1 = [];
  const s = save((s) => {
    const x = s.runs[RK];
    if (!x || x.id !== r.id) return;
    const bk = bookOf(s, x.mode);
    if (bk && !bk[x.date]) bk[x.date] = { st: x.res.map((y) => y.st) };
    const kk = x.mode + ":" + x.date;
    if ((x.mode === "d" || x.mode === "h") && !s.kofi[kk] && x.res.every((y) => y.st === 3)) { s.kofi[kk] = 1; kofi = true; } // 今日・上級を初めて全部★3で終えたときだけ、Ko-fi の1行
    for (const a of achOf(s)) if (a.got && !s.ach[a.id]) { s.ach[a.id] = 1; fresh1.push(a); }
    s.runs[RK] = null; delete s.runs[RK];
  });
  result(r.mode, r.date, { run: r, kofi, fresh1 });
}

// ---- 思い出す：集めた条文の文を見て、どの条文かを当てる（逆向きに思い出す練習。久しく出していない条文から先に＝間をあけて解き直す）----
let RC = null;
function recallStart() {
  const s = save((x) => { x.rcn = (x.rcn || 0) + 1; }), have = LAWIDS.filter((k) => s.laws[k]);
  if (have.length < 3) return bookView();
  const R = G.rng(G.seedOf(todayKey() + ":r:" + s.rcn));
  const list = G.shuffle(have, R).sort((a, b) => (s.rc[a] || 0) - (s.rc[b] || 0)).slice(0, 5); // 比べる中では乱数を引かない
  RC = { list: list.map((k) => { const same = have.filter((x) => x !== k && LAWS[x].law === LAWS[k].law), other = have.filter((x) => x !== k && LAWS[x].law !== LAWS[k].law); const wrong = [...G.shuffle(same, R), ...G.shuffle(other, R)].slice(0, 2); return { k, opts: G.shuffle([k, ...wrong], R) }; }), i: 0, ok: 0, ans: null };
  recallView();
}
function recallView() {
  if (!RC) return bookView();

    draw(`${back("思い出す")}<div class="win"><div class="big">${RC.ok}/${RC.list.length}</div><p class="note">思い出せた条文。外したものは条文帳で読み直せます。</p></div>

  }

  draw(`${back(`思い出す ${RC.i + 1}/${RC.list.length}`, "記録には入りません")}
    <div class="deed recall" id="rtext" data-a11y-say>「${esc(L.text)}」</div>
    ${a ? "" : `<p class="ask">これはどの条文？<small>条文帳に集めた条文から</small></p>`}
    <div class="cards${a ? " done" : ""}">${opts.map((id) => { const x = LAWS[id]; return `<button class="card${a && id === k ? " right" : ""}${a && id === a && a !== k ? " wrong" : ""}" data-r="${id}" ${a ? "disabled" : ""} aria-label="${x.law}${x.no} ${x.name}${cardSt(a && id === k, a && id === a && a !== k)}"><span class="no">${x.law}<b>${x.no}</b></span><span class="nm">${esc(x.name)}</span>${cardMk(a && id === k, a && id === a && a !== k)}</button>`; }).join("")}</div>

// ---- カレンダー（ひと月ずつ。取りこぼした日はあとから遊べる）----
function calendar(ym) {
  const s = load(), k = todayKey(); ym = ym || k.slice(0, 7);
  const [y, mo] = ym.split("-").map(Number), first = new Date(Date.UTC(y, mo - 1, 1)), days = new Date(Date.UTC(y, mo, 0)).getUTCDate();
  const can = new Set(missedDays(s, k)), st = streak(s.days);
  const prev = new Date(Date.UTC(y, mo - 2, 1)).toISOString().slice(0, 7), nxt = new Date(Date.UTC(y, mo, 1)).toISOString().slice(0, 7);
  const cells = [];
  for (let i = 0; i < first.getUTCDay(); i++) cells.push(`<span></span>`);
  for (let d = 1; d <= days; d++) {
    const key = `${ym}-${String(d).padStart(2, "0")}`, r = s.days[key], p = s.pdays[key], h = s.hdays[key];
    const cls = r ? "on" : p ? "later" : can.has(key) ? "can" : "";
    const sum = (x) => x.st.reduce((a, b) => a + b, 0);
    cells.push(`<${can.has(key) ? "button" : "span"} class="d ${cls}${key === k ? " today" : ""}" data-k="${key}" aria-label="${md(key)}${r ? " 討伐" : p ? " あとから" : can.has(key) ? " あとから遊べる" : ""}${h ? " 上級" : ""}">${d}${r ? `<small>★${sum(r)}</small>` : p ? `<small>↺★${sum(p)}</small>` : ""}${h ? `<i class="h"></i>` : ""}</${can.has(key) ? "button" : "span"}>`);
  }
  draw(`${back("カレンダー")}
    <div class="calnav"><button class="icon" id="pm" ${prev < EPOCH.slice(0, 7) ? "disabled" : ""} aria-label="前の月">‹</button><b>${y}年${mo}月</b><button class="icon" id="nm" ${nxt > k.slice(0, 7) ? "disabled" : ""} aria-label="次の月">›</button></div>
    <div class="cal">${"日月火水木金土".split("").map((w) => `<span class="wd">${w}</span>`).join("")}${cells.join("")}</div>
    <div class="legend"><span>金：今日の5体</span><span>点線：あとから遊べる（7日まで）</span><span>▲：上級</span></div>
    ${st ? `<p class="note">${st}日つづけて討伐中</p>` : ""}
    <p class="note">あとから遊んだ日は、連続の日には入りません（図鑑・条文帳・実績には入ります）。</p>${footer()}`);
  $("back").onclick = home;
  $("pm").onclick = () => calendar(prev); $("nm").onclick = () => calendar(nxt);
  document.querySelectorAll(".cal button.d").forEach((b) => (b.onclick = () => startRun("a", b.dataset.k)));
  bindFooter();
}
